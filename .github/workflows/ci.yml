name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Qt must not try to open a window on a CI runner.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the project and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check --output-format=github .

      - name: black
        run: black --check --diff .

      - name: mypy
        run: mypy

  test-linux:
    name: Tests (linux, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the project and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest --cov=pypackhub --cov-report=term-missing

  # The spec asks for a Windows/macOS/Linux matrix. Running the desktop legs
  # on every feature-branch push would multiply CI cost (Windows runners are
  # billed at 2x and macOS at 10x), so the compromise is: every push to main
  # and every pull request get all three operating systems - main is what
  # people clone - while a feature-branch push still gets the full Linux
  # matrix. See docs/DECISIONS.md.
  test-desktop:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the project and the dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest

  locks:
    name: Dependency locks are current
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        # An exact version, not a major alias: setup-uv stopped publishing
        # moving major tags after v8, so a bare `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.2.0

      - name: Regenerate the locks from pyproject.toml
        run: bash scripts/generate_locks.sh

      - name: Fail when the committed locks are stale
        run: git diff --exit-code -- requirements.lock requirements-dev.lock

  # Section 5's "minimal build job": the sdist and wheel both build, the wheel
  # installs into an empty environment, the console entry point is really
  # declared, and the bundled fonts and icon data actually shipped. Packaging
  # mistakes are silent until a user hits them, so they are caught here.
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Install the wheel without its dependencies
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: The console entry point is declared
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points

          scripts = {
              point.name: point.value
              for point in entry_points(group="console_scripts")
          }
          assert scripts.get("pypackhub") == "pypackhub.ui.app:run", scripts
          print("console script:", scripts["pypackhub"])
          PY

      - name: The bundled data files shipped
        run: |
          python - <<'PY'
          from pathlib import Path
          import pypackhub

          package = Path(pypackhub.__file__).parent
          fonts = sorted(
              path
              for path in (package / "assets").rglob("*")
              if path.suffix.lower() in {".ttf", ".otf", ".woff2"}
          )
          # The window is unusable without the bundled faces: the Persian UI is
          # set in Vazirmatn and the Latin UI in Inter, and neither is assumed to
          # be installed on the machine.
          assert fonts, "no bundled font files shipped in the wheel"
          print("bundled font files:", len(fonts))
          PY

      - name: The distributions build from the sdist too
        run: python -m build --wheel --outdir /tmp/rebuilt dist/*.tar.gz
