name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly audit, so a new advisory against a pinned dependency is noticed
    # even in a quiet week.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: python -m pip install "bandit>=1.7.9"

      - name: bandit
        run: bandit -c pyproject.toml -r src

      # Still missing here, and deliberately not pretended otherwise: the
      # project's own banned-pattern scanner (shell=True, os.system, eval, exec,
      # pickle.loads, unsafe yaml.load, verify=False) and the security
      # test-suite under tests/security/. Both arrive in section 1 of the
      # Phase 1 plan; until then bandit is the only static check in this job.

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Audit the committed lock file
        # The lock carries hashes and lists every transitive dependency, so the
        # audit runs against exactly the set we pin instead of re-resolving.
        run: uvx pip-audit -r requirements.lock --disable-pip --progress-spinner off
