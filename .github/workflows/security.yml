name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly audit, so a new advisory against a pinned dependency is noticed
    # even in a quiet week.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: python -m pip install "bandit>=1.7.9"

      - name: bandit
        run: bandit -c pyproject.toml -r src

      - name: Banned patterns
        run: python scripts/security_scan.py

  security-tests:
    name: Security test-suite
    runs-on: ubuntu-latest
    env:
      # No Qt binding is selected because none is installed; this job exists to
      # prove the core and the Qt-free parts of the UI work without one.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # The project is installed without its GUI dependency on purpose: these
      # tests must keep passing without Qt, which is what proves the core is
      # really headless instead of only claiming to be.
      - name: Install the core without Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .

          # The runtime dependencies are read from pyproject.toml, with the GUI
          # toolkit removed, rather than repeated as a hand-written list. This
          # job failed once because such a list had gone stale and was missing
          # platformdirs, so `pypackhub.core.settings` could not even be
          # imported; deriving the list makes that failure impossible.
          python - <<'PY' > "${RUNNER_TEMP}/core-requirements.txt"
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in project["project"]["dependencies"]:
              name = re.split(r"[<>=!~;\[\s]", requirement, maxsplit=1)[0].lower()
              if name != "pyside6":
                  print(requirement)
          PY

          python -m pip install -r "${RUNNER_TEMP}/core-requirements.txt"
          python -m pip install pytest

      # Qt must really be absent. If a stray dependency pulls it back in, the
      # job would pass while proving nothing, so the guarantee is asserted.
      - name: Assert Qt is not installed
        run: |
          if python -c "import PySide6" 2>/dev/null; then
            echo "::error::PySide6 is installed; this job no longer proves the core is headless"
            exit 1
          fi

      - name: Security tests
        run: python -m pytest -m security

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        # An exact version, not a major alias: setup-uv stopped publishing
        # moving major tags after v8, so `@v10` does not resolve at all and the
        # job fails before it starts.
        uses: astral-sh/setup-uv@v10.2.0

      - name: Audit the committed lock file
        # The lock carries hashes and lists every transitive dependency, so the
        # audit runs against exactly the set we pin instead of re-resolving.
        run: uvx pip-audit -r requirements.lock --disable-pip --progress-spinner off
