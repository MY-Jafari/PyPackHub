name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly audit, so a new advisory against a pinned dependency is noticed
    # even in a quiet week.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: python -m pip install "bandit>=1.7.9"

      - name: bandit
        run: bandit -c pyproject.toml -r src

      - name: Banned patterns
        run: python scripts/security_scan.py

  security-tests:
    name: Security test-suite
    runs-on: ubuntu-latest
    env:
      PYTEST_QT_API: pyside6
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # The project is installed without its GUI dependencies on purpose: these
      # tests must keep passing without Qt, which is what proves the core is
      # really headless instead of only claiming to be.
      - name: Install the core without Qt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest packaging httpx keyring

      - name: Security tests
        run: python -m pytest -m security

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Audit the committed lock file
        # The lock carries hashes and lists every transitive dependency, so the
        # audit runs against exactly the set we pin instead of re-resolving.
        run: uvx pip-audit -r requirements.lock --disable-pip --progress-spinner off
